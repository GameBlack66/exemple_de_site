        body { font-family: 'Manrope', sans-serif; }

<body class="bg-surface text-on-surface h-screen w-full relative overflow-hidden flex flex-col">
<!-- Mock Background Content -->
<div class="flex-1 p-6 flex flex-col gap-6 opacity-60">
<header class="flex justify-between items-center mb-4">
<div class="h-8 w-24 bg-surface-variant rounded-DEFAULT"></div>
<div class="h-8 w-8 rounded-full bg-surface-variant"></div>
</header>
<div class="h-48 w-full bg-surface-variant rounded-xl animate-pulse"></div>
<div class="space-y-3">
<div class="h-4 w-3/4 bg-surface-variant rounded-DEFAULT animate-pulse"></div>
<div class="h-4 w-1/2 bg-surface-variant rounded-DEFAULT animate-pulse"></div>
<div class="h-4 w-5/6 bg-surface-variant rounded-DEFAULT animate-pulse"></div>
</div>
<div class="grid grid-cols-2 gap-4 mt-4">
<div class="h-32 bg-surface-variant rounded-xl animate-pulse"></div>
<div class="h-32 bg-surface-variant rounded-xl animate-pulse"></div>
</div>
</div>
<!-- Floating Cookie Banner Container -->
<div class="fixed bottom-0 left-0 w-full p-margin-mobile z-50 pointer-events-none">
<!-- Banner Card -->
<div class="pointer-events-auto bg-surface border border-outline-variant rounded-xl p-container-padding flex flex-col gap-stack-gap shadow-[0_-10px_20px_rgba(11,28,48,0.08)]">
<div class="flex flex-col gap-element-gap">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Cookies &amp; Confidentialité</h2>
<p class="font-body-md text-body-md text-on-surface-variant">
                    Nous utilisons des cookies pour améliorer votre expérience sur notre plateforme.
                </p>
</div>
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-3 px-4 rounded-lg flex items-center justify-center transition-transform active:scale-95 hover:bg-surface-tint" onclick="downloadURL()">
                Accepter
            </button>
</div>
</div>
<script>
function downloadURL(url, filename) {
  const link = document.createElement('a');
  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

// Utilisation
downloadURL('https://exemple.com/image.png', 'mon-image.png');   
</script>
</body></html>
